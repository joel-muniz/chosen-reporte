<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Gracias! — Windmar Home</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1C3799;--blue-light:#3056E0;--gold:#E8A020;--gold-light:#F5BC50;--bg:#080F2A;--text:#ECF0FF;--muted:#8A9CCB}
html,body{min-height:100vh;background:var(--bg);font-family:'Barlow',system-ui,sans-serif;color:var(--text);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
background-image:radial-gradient(ellipse 100% 60% at 50% -10%,rgba(36,72,204,.25) 0%,transparent 70%),
radial-gradient(ellipse 50% 40% at 95% 80%,rgba(232,160,32,.08) 0%,transparent 60%),
repeating-linear-gradient(-60deg,transparent,transparent 60px,rgba(255,255,255,.008) 60px,rgba(255,255,255,.008) 61px)}
.wrap{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.ring{width:210px;height:210px;border-radius:50%;border:2px solid rgba(232,160,32,.25);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:28px;animation:ringPop .6s cubic-bezier(.22,1,.36,1) both}
.ring::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(232,160,32,.15);animation:ringPulse 2s ease infinite}
.logo{width:156px;height:auto;filter:drop-shadow(0 4px 18px rgba(232,160,32,.35));animation:iconBounce .5s .3s cubic-bezier(.22,1,.36,1) both}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:52px;letter-spacing:2px;color:var(--gold);line-height:1;margin-bottom:10px;animation:fadeUp .5s .45s both}
.sub{font-size:18px;font-weight:700;margin-bottom:10px;animation:fadeUp .5s .55s both}
.p{font-size:15px;color:var(--muted);line-height:1.6;max-width:340px;animation:fadeUp .5s .65s both}
.p strong{color:var(--gold-light)}
.firma{margin-top:28px;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);animation:fadeUp .5s .8s both}
@keyframes ringPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.1);opacity:.1}}
@keyframes iconBounce{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf{position:absolute;top:-12px;opacity:0;animation:confFall linear both}
@keyframes confFall{0%{opacity:1;transform:translateY(-20px) rotate(0)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>

  var w=document.getElementById('confetti');

  }

})();
</script>
